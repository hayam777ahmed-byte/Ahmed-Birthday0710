<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Birthday Ahmed 🤍</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:wght@500;600&display=swap');
*{box-sizing:border-box}
body{
 margin:0; min-height:100vh; display:grid; place-items:center; overflow:hidden;
 background:radial-gradient(circle at 20% 20%,#fff8f1 0,#f8eee6 35%,#eadbd0 100%);
 color:#4b3a34; font-family:'DM Sans',sans-serif;
}
.card{
 width:min(88vw,620px); padding:72px 42px; text-align:center; position:relative;
 background:rgba(255,252,248,.76); border:1px solid rgba(255,255,255,.8);
 border-radius:30px; box-shadow:0 24px 70px rgba(91,66,54,.16);
 backdrop-filter:blur(12px);
}
.glow{position:absolute;width:180px;height:180px;border-radius:50%;filter:blur(3px);opacity:.55}
.g1{background:#efd1c2;top:-85px;left:-65px}.g2{background:#dfc5b7;bottom:-90px;right:-60px}
.small{letter-spacing:4px;text-transform:uppercase;font-size:12px;color:#9a7667;margin-bottom:18px}
h1{
 font-family:'Playfair Display',serif;font-size:clamp(42px,8vw,68px);line-height:1.05;
 font-weight:600;margin:0 0 24px;color:#493630;
}
p{font-size:18px;line-height:1.8;margin:0 auto;max-width:470px;color:#705c54}
.name{color:#9b6958}
.heart{font-size:26px;margin-top:28px;animation:pulse 2.2s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.spark{position:absolute;color:#b98c78;opacity:.45;font-size:18px}
.s1{top:30px;right:42px}.s2{bottom:34px;left:40px}.s3{top:50%;left:18px}
.footer{margin-top:38px;font-size:12px;letter-spacing:2px;color:#a18a80}

.balloons{position:fixed;inset:0;pointer-events:none;overflow:hidden}.balloon{position:absolute;bottom:-120px;width:42px;height:52px;border-radius:50% 50% 45% 45%;opacity:.9;animation:rise 6s ease-in forwards}.balloon:after{content:"";position:absolute;left:50%;top:100%;width:1px;height:90px;background:#9b8177}.b1{left:8%;background:#d8a99a;animation-delay:.1s}.b2{left:25%;background:#ead0c2;animation-delay:.7s}.b3{left:45%;background:#b98c78;animation-delay:.35s}.b4{right:24%;background:#d6b7aa;animation-delay:1s}.b5{right:7%;background:#c99583;animation-delay:.55s}@keyframes rise{0%{transform:translateY(0) rotate(-4deg);opacity:0}15%{opacity:.9}100%{transform:translateY(-120vh) rotate(8deg);opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;opacity:0;animation:showConfetti 1s 1.4s forwards}.piece{position:absolute;width:7px;height:16px;background:#b98c78;top:-20px;animation:fall 3s linear infinite}.p1{left:12%;animation-delay:1.4s}.p2{left:34%;animation-delay:1.8s}.p3{left:58%;animation-delay:1.5s}.p4{left:82%;animation-delay:2s}@keyframes fall{to{transform:translateY(110vh) rotate(500deg)}}@keyframes showConfetti{to{opacity:1}}
.card{opacity:0;transform:translateY(18px) scale(.97);animation:cardIn 1s 1.6s ease-out forwards}@keyframes cardIn{to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="balloons"><i class="balloon b1"></i><i class="balloon b2"></i><i class="balloon b3"></i><i class="balloon b4"></i><i class="balloon b5"></i></div>
<div class="confetti"><i class="piece p1"></i><i class="piece p2"></i><i class="piece p3"></i><i class="piece p4"></i></div>
<div class="card">
 <div class="glow g1"></div><div class="glow g2"></div>
 <div class="spark s1">✦</div><div class="spark s2">✦</div><div class="spark s3">·</div>
 <div class="small">A little birthday wish for you</div>
 <h1>Happy Birthday,<br><span class="name">Ahmed</span> 🤍</h1>
 <p>
   Wishing you a beautiful year ahead, filled with
   <strong>positive energy</strong>, peaceful moments,
   new adventures, and lots of reasons to smile.
 </p>
 <div class="heart">♡</div>
 <div class="footer">MAKE THIS YEAR YOURS</div>
</div>
</body>
</html>
